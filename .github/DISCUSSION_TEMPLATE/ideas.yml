# Used by the "Ideas" category once Discussions are enabled on this repository.
body:
  - type: markdown
    attributes:
      value: |
        `hey-check` answers one question about a Robinhood Chain token or project: is anyone building it, and what did they ship?
        Ideas that keep it that small are welcome. It will not add a price, a risk score, a safety verdict or buy/sell wording.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to find out or do that hey-check does not make easy today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The command, flag or output you have in mind, with an example.
  - type: textarea
    id: source
    attributes:
      label: Where the data would come from
      description: hey-check relays Hey Research Lab's public API and computes nothing of its own. Name the public endpoint or field, if you know it (https://heyresearch.xyz/docs/public-api).
